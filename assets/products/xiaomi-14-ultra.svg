<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXio" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="leicaRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="xioShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgXio)"/>
  <ellipse cx="250" cy="450" rx="120" ry="18" fill="#0f172a" opacity="0.16" filter="blur(10px)"/>

  <!-- Phone Back (Showing Massive Leica Camera) -->
  <g filter="url(#xioShadow)">
    <!-- Faux-Leather Textured Back Body -->
    <rect x="155" y="45" width="190" height="385" rx="32" fill="#18181b"/>
    <!-- Silver Metal Frame Rim -->
    <rect x="155" y="45" width="190" height="385" rx="32" fill="none" stroke="#94a3b8" stroke-width="3"/>

    <!-- Giant Circular Camera Module -->
    <circle cx="250" cy="180" r="75" fill="url(#leicaRing)"/>
    <circle cx="250" cy="180" r="71" fill="#09090b"/>
    <circle cx="250" cy="180" r="62" fill="#18181b"/>

    <!-- 4 Leica Camera Lenses -->
    <!-- Top 1-inch Main Lens -->
    <circle cx="250" cy="142" r="18" fill="#020617"/>
    <circle cx="250" cy="142" r="12" fill="#1e1b4b"/>
    <circle cx="248" cy="140" r="4" fill="#38bdf8" opacity="0.8"/>

    <!-- Bottom Periscope Telephoto Lens -->
    <rect x="238" y="196" width="24" height="24" rx="4" fill="#020617"/>
    <circle cx="250" cy="208" r="8" fill="#1e293b"/>

    <!-- Left Ultrawide Lens -->
    <circle cx="212" cy="180" r="14" fill="#020617"/>
    <circle cx="212" cy="180" r="8" fill="#1e293b"/>

    <!-- Right 3.2x Telephoto Lens -->
    <circle cx="288" cy="180" r="14" fill="#020617"/>
    <circle cx="288" cy="180" r="8" fill="#1e293b"/>

    <!-- Center Leica Branding & Red Dot -->
    <circle cx="250" cy="176" r="6" fill="#dc2626"/>
    <text x="250" y="179" text-anchor="middle" fill="#ffffff" font-family="'Times New Roman', serif" font-size="7" font-weight="900">L</text>
    
    <!-- Camera Spec Ring Text -->
    <text x="250" y="240" text-anchor="middle" fill="#a1a1aa" font-family="sans-serif" font-size="7" font-weight="700" letter-spacing="1">VARIO-SUMMILUX 1:1.63-2.5/12-120</text>

    <!-- Xiaomi Logo Bottom -->
    <text x="250" y="395" text-anchor="middle" fill="#71717a" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="2">Xiaomi</text>
  </g>
</svg>