<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowS24" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="s24Frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="s24Wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="s24Shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGlowS24)"/>
  <ellipse cx="230" cy="455" rx="130" ry="18" fill="#0f172a" opacity="0.16" filter="blur(10px)"/>

  <!-- Phone Body (Sharp Corners) -->
  <g filter="url(#s24Shadow)">
    <rect x="135" y="42" width="195" height="390" rx="10" fill="url(#s24Frame)"/>
    <rect x="139" y="46" width="187" height="382" rx="7" fill="#020617"/>
    <rect x="142" y="49" width="181" height="376" rx="5" fill="url(#s24Wallpaper)"/>

    <!-- Galaxy AI Geometric Graphic -->
    <polygon points="232,150 270,180 250,225 200,210" fill="none" stroke="rgba(199,210,254,0.4)" stroke-width="2"/>
    <polygon points="210,170 255,160 275,210 225,230" fill="none" stroke="rgba(147,197,253,0.3)" stroke-width="2"/>
    <circle cx="232" cy="190" r="40" fill="#6366f1" opacity="0.25" filter="blur(20px)"/>

    <!-- Center Punch-Hole Camera -->
    <circle cx="232" cy="62" r="4.5" fill="#000000"/>
    <circle cx="232" cy="62" r="2" fill="#1e293b"/>

    <!-- Time & Galaxy UI -->
    <text x="232" y="115" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">12:45</text>
    <text x="232" y="132" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Galaxy AI is here ✨</text>

    <!-- Side Buttons -->
    <rect x="330" y="130" width="3.5" height="42" rx="1.5" fill="#64748b"/>
    <rect x="330" y="185" width="3.5" height="28" rx="1.5" fill="#64748b"/>
  </g>

  <!-- S-Pen Stylus Standing Beside -->
  <g transform="translate(360, 110) rotate(12)" filter="url(#s24Shadow)">
    <rect x="0" y="0" width="11" height="280" rx="5" fill="#334155"/>
    <rect x="0" y="0" width="11" height="25" rx="4" fill="#1e293b"/>
    <rect x="2" y="270" width="7" height="18" rx="3" fill="#94a3b8"/>
    <!-- Stylus Tip -->
    <polygon points="5.5,296 2,286 9,286" fill="#020617"/>
    <!-- Clicker Button on Top -->
    <rect x="2" y="-5" width="7" height="6" rx="2" fill="#64748b"/>
    <line x1="2" y1="120" x2="9" y2="120" stroke="#0ea5e9" stroke-width="2"/>
  </g>
</svg>