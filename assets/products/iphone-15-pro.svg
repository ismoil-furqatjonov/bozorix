<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3cf"/>
      <stop offset="25%" stop-color="#a8a29e"/>
      <stop offset="50%" stop-color="#e7e5e4"/>
      <stop offset="75%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#b0aba5"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="wallGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="450" rx="140" ry="20" fill="#0f172a" opacity="0.15" filter="blur(10px)"/>

  <!-- Phone Body -->
  <g filter="url(#phoneShadow)">
    <!-- Titanium Outer Rim -->
    <rect x="155" y="45" width="190" height="385" rx="38" fill="url(#titaniumFrame)"/>
    <!-- Black Inner Bezel -->
    <rect x="159" y="49" width="182" height="377" rx="35" fill="#09090b"/>
    <!-- Screen Glass -->
    <rect x="163" y="53" width="174" height="369" rx="31" fill="url(#screenGrad)"/>
    <!-- Screen Wallpaper Graphics -->
    <circle cx="250" cy="220" r="75" fill="url(#wallGlow)" filter="blur(20px)"/>
    <path d="M 170 300 Q 250 200 330 310" stroke="rgba(255,255,255,0.15)" stroke-width="40" fill="none" filter="blur(15px)"/>
    
    <!-- Dynamic Island -->
    <rect x="220" y="65" width="60" height="18" rx="9" fill="#000000"/>
    <circle cx="230" cy="74" r="4" fill="#18181b"/>
    <circle cx="268" cy="74" r="3" fill="#0f172a"/>

    <!-- Screen UI Header -->
    <text x="185" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">09:41</text>
    <path d="M 310 72 L 322 72 M 310 76 L 318 76 M 310 80 L 314 80" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Screen Clock Widget -->
    <text x="250" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="300" letter-spacing="-1">09:41</text>
    <text x="250" y="185" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Dushanba, 2-Noyabr</text>

    <!-- Bottom Home Bar -->
    <rect x="215" y="412" width="70" height="4" rx="2" fill="#ffffff" opacity="0.8"/>

    <!-- Subtle Titanium Highlights -->
    <line x1="156" y1="90" x2="156" y2="400" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
    <line x1="344" y1="90" x2="344" y2="400" stroke="#000000" stroke-width="1.2" opacity="0.3"/>
    <!-- Side Buttons -->
    <rect x="151" y="105" width="4" height="20" rx="2" fill="#8f8a84"/>
    <rect x="151" y="135" width="4" height="38" rx="2" fill="#8f8a84"/>
    <rect x="151" y="180" width="4" height="38" rx="2" fill="#8f8a84"/>
    <rect x="345" y="135" width="4" height="52" rx="2" fill="#8f8a84"/>
  </g>
</svg>