<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgAir" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="glossyWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="airShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgAir)"/>
  <ellipse cx="250" cy="440" rx="140" ry="16" fill="#0f172a" opacity="0.14" filter="blur(10px)"/>

  <!-- Charging Case Open -->
  <g filter="url(#airShadow)">
    <!-- Case Body Bottom -->
    <rect x="155" y="235" width="190" height="145" rx="55" fill="url(#glossyWhite)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Status LED -->
    <circle cx="250" cy="275" r="3.5" fill="#22c55e" filter="drop-shadow(0 0 4px #22c55e)"/>
    <!-- Lid Cut Line -->
    <path d="M 155 240 Q 250 250 345 240" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <!-- USB-C Port Bottom -->
    <rect x="238" y="373" width="24" height="5" rx="2.5" fill="#94a3b8"/>
    <!-- Speaker Holes -->
    <circle cx="225" cy="375" r="1.5" fill="#64748b"/>
    <circle cx="275" cy="375" r="1.5" fill="#64748b"/>
  </g>

  <!-- Left Earbud (Floating) -->
  <g transform="translate(130, 95)" filter="url(#airShadow)">
    <!-- Stem -->
    <rect x="45" y="45" width="15" height="65" rx="7.5" fill="url(#glossyWhite)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Force Sensor Indent -->
    <rect x="43" y="65" width="2.5" height="18" rx="1" fill="#94a3b8"/>
    <!-- Head / Earpiece -->
    <circle cx="35" cy="45" r="26" fill="url(#glossyWhite)"/>
    <!-- Black Acoustic Vent -->
    <ellipse cx="32" cy="35" rx="9" ry="5" fill="#18181b"/>
    <!-- Silicone In-Ear Tip -->
    <ellipse cx="12" cy="52" rx="14" ry="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="6" cy="52" rx="4" ry="8" fill="#334155"/>
  </g>

  <!-- Right Earbud (Floating) -->
  <g transform="translate(290, 95)" filter="url(#airShadow)">
    <!-- Stem -->
    <rect x="15" y="45" width="15" height="65" rx="7.5" fill="url(#glossyWhite)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Force Sensor Indent -->
    <rect x="29" y="65" width="2.5" height="18" rx="1" fill="#94a3b8"/>
    <!-- Head / Earpiece -->
    <circle cx="40" cy="45" r="26" fill="url(#glossyWhite)"/>
    <!-- Black Acoustic Vent -->
    <ellipse cx="43" cy="35" rx="9" ry="5" fill="#18181b"/>
    <!-- Silicone In-Ear Tip -->
    <ellipse cx="62" cy="52" rx="14" ry="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="68" cy="52" rx="4" ry="8" fill="#334155"/>
  </g>
</svg>