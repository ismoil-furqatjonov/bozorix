<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="ipadWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="padShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgPad)"/>
  <ellipse cx="250" cy="450" rx="140" ry="16" fill="#0f172a" opacity="0.16" filter="blur(10px)"/>

  <g filter="url(#padShadow)">
    <!-- Space Gray Aluminum Unibody -->
    <rect x="110" y="60" width="280" height="380" rx="30" fill="#374151"/>
    <!-- Black Screen Border -->
    <rect x="116" y="66" width="268" height="368" rx="24" fill="#09090b"/>
    <!-- 11-inch Liquid Retina Screen -->
    <rect x="126" y="76" width="248" height="348" rx="16" fill="url(#ipadWall)"/>

    <!-- Horizontal Front Camera in Bezel -->
    <circle cx="250" cy="71" r="3" fill="#1f2937"/>

    <!-- Abstract Graphic on Screen -->
    <path d="M 140 320 Q 250 150 360 280" stroke="rgba(255,255,255,0.4)" stroke-width="25" fill="none" filter="blur(8px)"/>
    <circle cx="250" cy="220" r="50" fill="#ffffff" opacity="0.15" filter="blur(10px)"/>

    <!-- Dock -->
    <rect x="180" y="395" width="140" height="16" rx="8" fill="rgba(255,255,255,0.3)" backdrop-filter="blur(5px)"/>
    <circle cx="196" cy="403" r="4" fill="#ffffff"/>
    <circle cx="214" cy="403" r="4" fill="#38bdf8"/>
    <circle cx="232" cy="403" r="4" fill="#fbbf24"/>
    <circle cx="250" cy="403" r="4" fill="#4ade80"/>
    <circle cx="268" cy="403" r="4" fill="#f43f5e"/>

    <!-- Apple Pencil Pro Magnetically Attached to Right Edge -->
    <g transform="translate(393, 130)">
      <rect x="0" y="0" width="8" height="220" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Pencil Tip -->
      <polygon points="4,228 0,220 8,220" fill="#334155"/>
      <polygon points="4,233 2,228 6,228" fill="#18181b"/>
      <!-- Wireless Charging Glow Ring -->
      <circle cx="4" cy="50" r="2.5" fill="#22c55e" opacity="0.8"/>
    </g>
  </g>
</svg>