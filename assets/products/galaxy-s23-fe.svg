<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgFe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="mintGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="feShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgFe)"/>
  <ellipse cx="250" cy="450" rx="120" ry="18" fill="#0f172a" opacity="0.16" filter="blur(10px)"/>

  <!-- Phone Back (Showing Triple Floating Camera Array) -->
  <g filter="url(#feShadow)">
    <!-- Fresh Mint Glass Back -->
    <rect x="155" y="45" width="190" height="385" rx="34" fill="url(#mintGreen)"/>
    <!-- Aluminum Perimeter Frame -->
    <rect x="155" y="45" width="190" height="385" rx="34" fill="none" stroke="#6ee7b7" stroke-width="2.5"/>

    <!-- 3 Floating Camera Lenses (Vertical Array) -->
    <!-- Lens 1 (Top) -->
    <circle cx="195" cy="105" r="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="195" cy="105" r="11" fill="#020617"/>
    <circle cx="193" cy="103" r="3" fill="#38bdf8"/>

    <!-- Lens 2 (Middle) -->
    <circle cx="195" cy="145" r="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="195" cy="145" r="11" fill="#020617"/>
    <circle cx="193" cy="143" r="3" fill="#38bdf8"/>

    <!-- Lens 3 (Bottom) -->
    <circle cx="195" cy="185" r="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="195" cy="185" r="11" fill="#020617"/>
    <circle cx="193" cy="183" r="3" fill="#38bdf8"/>

    <!-- LED Flash Beside Top Lens -->
    <circle cx="230" cy="115" r="5" fill="#fef08a" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Samsung Logo Bottom -->
    <text x="250" y="395" text-anchor="middle" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="3">SAMSUNG</text>
  </g>
</svg>