<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDyson" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="goldWand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dysonShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgDyson)"/>
  <ellipse cx="250" cy="455" rx="160" ry="16" fill="#0f172a" opacity="0.15" filter="blur(10px)"/>

  <!-- Cordless Vacuum Slanted Architecture -->
  <g transform="translate(40, -10) rotate(22, 250, 250)" filter="url(#dysonShadow)">
    <!-- Main Motor & Cyclonic Chamber -->
    <rect x="220" y="60" width="60" height="85" rx="15" fill="#71717a"/>
    <!-- Red Accent Cyclone Cones -->
    <path d="M 225 105 L 275 105 L 268 145 L 232 145 Z" fill="#ef4444"/>
    
    <!-- Clear Dust Bin -->
    <rect x="225" y="145" width="50" height="75" rx="6" fill="rgba(226,232,240,0.7)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="235" y="155" width="30" height="50" fill="#475569" opacity="0.4"/>
    <rect x="272" y="170" width="6" height="20" rx="3" fill="#ef4444"/>

    <!-- Handle & Trigger -->
    <path d="M 220 85 Q 165 95 165 150 Q 165 195 225 195" fill="none" stroke="#27272a" stroke-width="18" stroke-linecap="round"/>
    <!-- Red Trigger Button -->
    <rect x="195" y="115" width="6" height="14" rx="2" fill="#ef4444"/>
    <!-- Battery Base -->
    <rect x="155" y="185" width="55" height="26" rx="6" fill="#18181b"/>

    <!-- LCD Screen on Motor End -->
    <ellipse cx="250" cy="60" rx="22" ry="12" fill="#09090b" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="250" cy="60" r="5" fill="#22c55e"/>

    <!-- Long Golden Wand -->
    <rect x="242" y="220" width="16" height="195" rx="5" fill="url(#goldWand)"/>
    <text x="252" y="320" transform="rotate(90, 252, 320)" fill="#78350f" font-family="sans-serif" font-size="8" font-weight="900" letter-spacing="1">dyson v15 detect</text>

    <!-- Laser Fluffy Cleaner Head -->
    <g transform="translate(200, 415)">
      <!-- Articulated Neck -->
      <rect x="42" y="0" width="16" height="15" rx="4" fill="#3f3f46"/>
      <!-- Low Profile Head -->
      <rect x="0" y="15" width="100" height="28" rx="8" fill="#18181b"/>
      <!-- Soft Roller (Yellow/Blue stripes) -->
      <rect x="8" y="20" width="84" height="18" rx="6" fill="#facc15"/>
      <line x1="25" y1="20" x2="25" y2="38" stroke="#3b82f6" stroke-width="4"/>
      <line x1="45" y1="20" x2="45" y2="38" stroke="#3b82f6" stroke-width="4"/>
      <line x1="65" y1="20" x2="65" y2="38" stroke="#3b82f6" stroke-width="4"/>
      
      <!-- Green Laser Beam -->
      <polygon points="100,24 180,10 180,45" fill="rgba(34,197,94,0.3)" filter="blur(4px)"/>
      <line x1="98" y1="26" x2="180" y2="28" stroke="#22c55e" stroke-width="2.5" filter="drop-shadow(0 0 5px #22c55e)"/>
    </g>
  </g>
</svg>