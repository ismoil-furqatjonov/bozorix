<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="macMidnight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="30%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="macShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgMac)"/>
  <ellipse cx="250" cy="440" rx="180" ry="18" fill="#0f172a" opacity="0.18" filter="blur(12px)"/>

  <g filter="url(#macShadow)">
    <!-- Screen Lid -->
    <rect x="80" y="80" width="340" height="225" rx="14" fill="url(#macMidnight)"/>
    <rect x="86" y="86" width="328" height="213" rx="8" fill="#000000"/>
    <!-- Screen Display -->
    <rect x="90" y="90" width="320" height="205" rx="6" fill="url(#screenWall)"/>
    
    <!-- Notch at top -->
    <path d="M 236 90 L 236 98 A 4 4 0 0 0 240 102 L 260 102 A 4 4 0 0 0 264 98 L 264 90 Z" fill="#000000"/>
    <circle cx="250" cy="96" r="2.5" fill="#1e293b"/>

    <!-- macOS Dock Mockup -->
    <rect x="180" y="278" width="140" height="12" rx="6" fill="rgba(255,255,255,0.25)" backdrop-filter="blur(5px)"/>
    <circle cx="192" cy="284" r="3.5" fill="#38bdf8"/>
    <circle cx="204" cy="284" r="3.5" fill="#818cf8"/>
    <circle cx="216" cy="284" r="3.5" fill="#34d399"/>
    <circle cx="228" cy="284" r="3.5" fill="#f43f5e"/>
    <circle cx="240" cy="284" r="3.5" fill="#fbbf24"/>

    <!-- Laptop Base / Keyboard Deck (Perspective) -->
    <polygon points="50,380 450,380 420,305 80,305" fill="url(#macMidnight)"/>
    <!-- Keyboard Well -->
    <polygon points="110,345 390,345 380,312 120,312" fill="#09090b"/>
    <!-- Keyboard Grid Lines (Illuminated keys) -->
    <line x1="125" y1="322" x2="375" y2="322" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="120" y1="333" x2="380" y2="333" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <!-- Trackpad -->
    <polygon points="205,375 295,375 290,350 210,350" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    
    <!-- Front Lip with Thumb Notch -->
    <path d="M 45,380 L 455,380 L 450,387 L 50,387 Z" fill="#334155"/>
    <path d="M 235,380 L 265,380 L 263,383 L 237,383 Z" fill="#0f172a"/>
  </g>
</svg>