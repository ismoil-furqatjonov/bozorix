<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgRog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="rogScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rgbKeys" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="rogShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgRog)"/>
  <ellipse cx="250" cy="445" rx="180" ry="18" fill="#0f172a" opacity="0.18" filter="blur(12px)"/>

  <g filter="url(#rogShadow)">
    <!-- Stealth Lid -->
    <rect x="75" y="75" width="350" height="230" rx="10" fill="#18181b"/>
    <rect x="80" y="80" width="340" height="220" rx="6" fill="#09090b"/>
    <!-- 240Hz ROG Nebula Display -->
    <rect x="85" y="85" width="330" height="210" rx="4" fill="url(#rogScreen)"/>
    
    <!-- ROG Eye Logo Glow on Screen -->
    <path d="M 230 150 C 260 140, 280 160, 275 190 C 255 185, 245 170, 230 150 Z" fill="#ef4444" filter="drop-shadow(0 0 10px #ef4444)"/>
    <circle cx="240" cy="165" r="4" fill="#ffffff"/>
    <text x="250" y="235" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" letter-spacing="2">REPUBLIC OF GAMERS</text>
    <text x="250" y="255" text-anchor="middle" fill="#06b6d4" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">240Hz OLED · RTX 4080</text>

    <!-- Base / Deck (Perspective) -->
    <polygon points="40,385 460,385 425,305 75,305" fill="#18181b"/>
    <!-- RGB Keyboard Trench -->
    <polygon points="105,348 395,348 385,312 115,312" fill="#09090b"/>
    <!-- RGB Keyboard Lighting Bar -->
    <rect x="115" y="318" width="270" height="24" rx="3" fill="url(#rgbKeys)" opacity="0.75" filter="drop-shadow(0 0 6px #06b6d4)"/>
    
    <!-- Glass Trackpad -->
    <polygon points="205,380 295,380 290,354 210,354" fill="#27272a"/>
  </g>
</svg>