<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPix" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="bayBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cameraVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="pixShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgPix)"/>
  <ellipse cx="250" cy="450" rx="120" ry="18" fill="#0f172a" opacity="0.16" filter="blur(10px)"/>

  <!-- Phone Back (Showing Signature Camera Visor Bar) -->
  <g filter="url(#pixShadow)">
    <!-- Bay Blue Matte Glass Body -->
    <rect x="155" y="45" width="190" height="385" rx="36" fill="url(#bayBlue)"/>
    <!-- Aluminum Perimeter Frame -->
    <rect x="155" y="45" width="190" height="385" rx="36" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- Iconic Camera Visor Bar -->
    <rect x="145" y="105" width="210" height="65" rx="12" fill="url(#cameraVisor)"/>
    
    <!-- Dark Glass Cutout in Visor for Lenses -->
    <rect x="165" y="118" width="95" height="40" rx="20" fill="#09090b"/>
    <!-- Main Lens -->
    <circle cx="185" cy="138" r="14" fill="#1e293b"/>
    <circle cx="185" cy="138" r="8" fill="#020617"/>
    <!-- Ultrawide Lens -->
    <circle cx="218" cy="138" r="11" fill="#1e293b"/>
    <circle cx="218" cy="138" r="6" fill="#020617"/>
    <!-- 5x Telephoto Periscope Lens -->
    <circle cx="245" cy="138" r="7" fill="#020617"/>

    <!-- Right Side: Flash & Temperature Sensor -->
    <circle cx="315" cy="126" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="315" cy="148" r="4.5" fill="#334155"/>

    <!-- Google "G" Logo Center Back -->
    <text x="250" y="280" text-anchor="middle" fill="#0284c7" font-family="'Product Sans', sans-serif" font-size="28" font-weight="900">G</text>
  </g>
</svg>