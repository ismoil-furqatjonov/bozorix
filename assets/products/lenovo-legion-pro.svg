<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLeg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="legionScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#083344"/>
      <stop offset="80%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="legShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgLeg)"/>
  <ellipse cx="250" cy="445" rx="180" ry="18" fill="#0f172a" opacity="0.18" filter="blur(12px)"/>

  <g filter="url(#legShadow)">
    <!-- Onyx Grey Top Lid -->
    <rect x="75" y="75" width="350" height="230" rx="8" fill="#1f2937"/>
    <rect x="80" y="80" width="340" height="220" rx="5" fill="#111827"/>
    <!-- 16-inch 165Hz Screen -->
    <rect x="85" y="85" width="330" height="210" rx="4" fill="url(#legionScreen)"/>
    
    <!-- Legion Logo Graphic -->
    <polygon points="250,135 220,185 280,185" fill="none" stroke="#38bdf8" stroke-width="4" filter="drop-shadow(0 0 8px #38bdf8)"/>
    <line x1="250" y1="185" x2="250" y2="230" stroke="#38bdf8" stroke-width="4"/>
    <text x="250" y="260" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="4">LEGION</text>
    <text x="250" y="278" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="9" font-weight="700">WQHD+ 165Hz · RTX 4070</text>

    <!-- Laptop Lower Deck (Pro Extended Rear Vent) -->
    <polygon points="40,385 460,385 425,305 75,305" fill="#1f2937"/>
    <!-- Rear Exhaust Heat Sinks -->
    <rect x="80" y="300" width="50" height="8" fill="#0369a1"/>
    <rect x="370" y="300" width="50" height="8" fill="#0369a1"/>

    <!-- TrueStrike Keyboard Well -->
    <polygon points="105,348 395,348 385,312 115,312" fill="#030712"/>
    <!-- Cyan Backlit Keys Grid -->
    <line x1="120" y1="324" x2="380" y2="324" stroke="#06b6d4" stroke-width="1.5" opacity="0.8"/>
    <line x1="115" y1="336" x2="385" y2="336" stroke="#06b6d4" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Trackpad -->
    <polygon points="190,380 270,380 265,355 195,355" fill="#111827" stroke="#374151" stroke-width="1"/>
  </g>
</svg>