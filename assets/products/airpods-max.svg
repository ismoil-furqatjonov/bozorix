<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMax" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="spaceGrayAlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="maxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgMax)"/>
  <ellipse cx="250" cy="445" rx="140" ry="18" fill="#0f172a" opacity="0.18" filter="blur(10px)"/>

  <g filter="url(#maxShadow)">
    <!-- Breathable Knit Mesh Canopy (Headband) -->
    <path d="M 150 250 C 150 90, 350 90, 350 250" fill="none" stroke="#475569" stroke-width="24" stroke-linecap="round"/>
    <!-- Stainless Steel Frame Arms -->
    <path d="M 140 250 C 140 75, 360 75, 360 250" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Telescoping Arms -->
    <rect x="135" y="240" width="10" height="35" rx="5" fill="#cbd5e1"/>
    <rect x="355" y="240" width="10" height="35" rx="5" fill="#cbd5e1"/>

    <!-- Left Anodized Aluminum Ear Cup -->
    <g transform="translate(100, 255)">
      <rect x="0" y="0" width="70" height="95" rx="35" fill="url(#spaceGrayAlum)"/>
      <rect x="10" y="10" width="50" height="75" rx="25" fill="#1e293b"/>
      <!-- Acoustically engineered mesh pad -->
      <ellipse cx="70" cy="48" rx="10" ry="40" fill="#0f172a"/>
    </g>

    <!-- Right Anodized Aluminum Ear Cup -->
    <g transform="translate(330, 255)">
      <!-- Acoustically engineered mesh pad (Inner) -->
      <ellipse cx="0" cy="48" rx="10" ry="40" fill="#0f172a"/>
      <!-- Cup Body -->
      <rect x="0" y="0" width="70" height="95" rx="35" fill="url(#spaceGrayAlum)"/>
      <rect x="10" y="10" width="50" height="75" rx="25" fill="#1e293b"/>
      
      <!-- Digital Crown on Cup -->
      <rect x="35" y="-6" width="16" height="7" rx="3" fill="#cbd5e1"/>
      <!-- Noise Control Button -->
      <rect x="12" y="-4" width="14" height="5" rx="2" fill="#94a3b8"/>
    </g>
  </g>
</svg>