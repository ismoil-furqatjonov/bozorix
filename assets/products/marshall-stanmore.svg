<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="marShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgMar)"/>
  <ellipse cx="250" cy="450" rx="170" ry="18" fill="#0f172a" opacity="0.18" filter="blur(10px)"/>

  <g filter="url(#marShadow)">
    <!-- Black Vinyl Tolex Textured Cabinet -->
    <rect x="90" y="110" width="320" height="280" rx="14" fill="#18181b"/>
    <!-- Cream Piping Frame Trim -->
    <rect x="98" y="118" width="304" height="264" rx="10" fill="none" stroke="#fef3c7" stroke-width="3"/>

    <!-- Woven Salt-and-Pepper Acoustic Grille Cloth -->
    <rect x="106" y="155" width="288" height="220" rx="6" fill="#27272a"/>
    <!-- Pattern Texture lines -->
    <line x1="110" y1="180" x2="390" y2="180" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="110" y1="210" x2="390" y2="210" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="110" y1="240" x2="390" y2="240" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="110" y1="270" x2="390" y2="270" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="110" y1="300" x2="390" y2="300" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="110" y1="330" x2="390" y2="330" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Script "Marshall" Brass Script Emblem -->
    <g transform="translate(180, 240)">
      <text x="70" y="25" text-anchor="middle" fill="url(#brassGold)" font-family="'Brush Script MT', cursive, sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="-1">Marshall</text>
    </g>

    <!-- Top Recessed Brass Control Panel -->
    <polygon points="110,126 390,126 385,150 115,150" fill="url(#brassGold)"/>
    <!-- Knobs (Volume, Bass, Treble) -->
    <circle cx="160" cy="138" r="8" fill="#18181b" stroke="#78350f" stroke-width="2"/>
    <circle cx="210" cy="138" r="8" fill="#18181b" stroke="#78350f" stroke-width="2"/>
    <circle cx="260" cy="138" r="8" fill="#18181b" stroke="#78350f" stroke-width="2"/>
    <circle cx="310" cy="138" r="8" fill="#18181b" stroke="#78350f" stroke-width="2"/>
    <!-- Classic Power Toggle Switch -->
    <line x1="360" y1="132" x2="360" y2="144" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
    <circle cx="360" cy="132" r="3" fill="#fbbf24"/>

    <!-- Bottom Brass Etched Strip -->
    <rect x="106" y="365" width="288" height="10" fill="url(#brassGold)"/>
    <text x="250" y="373" text-anchor="middle" fill="#451a03" font-family="sans-serif" font-size="6" font-weight="900" letter-spacing="1">EST. 1962</text>
  </g>
</svg>