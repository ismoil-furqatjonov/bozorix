<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="silverSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="gwShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGw)"/>
  <ellipse cx="250" cy="450" rx="110" ry="16" fill="#0f172a" opacity="0.15" filter="blur(10px)"/>

  <!-- Black Hybrid Leather Band -->
  <path d="M 200 30 L 300 30 L 290 140 L 210 140 Z" fill="#1e293b"/>
  <line x1="205" y1="40" x2="205" y2="130" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="295" y1="40" x2="295" y2="130" stroke="#334155" stroke-dasharray="4,4"/>

  <path d="M 210 360 L 290 360 L 300 470 L 200 470 Z" fill="#1e293b"/>
  <line x1="205" y1="370" x2="205" y2="460" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="295" y1="370" x2="295" y2="460" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- Stainless Steel Round Case -->
  <g filter="url(#gwShadow)">
    <!-- Case Lugs -->
    <polygon points="195,130 205,170 175,185 165,145" fill="url(#silverSteel)"/>
    <polygon points="305,130 295,170 325,185 335,145" fill="url(#silverSteel)"/>
    <polygon points="195,370 205,330 175,315 165,355" fill="url(#silverSteel)"/>
    <polygon points="305,370 295,330 325,315 335,355" fill="url(#silverSteel)"/>

    <!-- Circular Case -->
    <circle cx="250" cy="250" r="115" fill="url(#silverSteel)"/>
    
    <!-- Physical Rotating Fluted Bezel (Ridges) -->
    <circle cx="250" cy="250" r="108" fill="#cbd5e1" stroke="#475569" stroke-width="4" stroke-dasharray="6,5"/>
    <circle cx="250" cy="250" r="100" fill="#09090b"/>

    <!-- Super AMOLED Display -->
    <circle cx="250" cy="250" r="92" fill="#020617"/>

    <!-- Chronograph Watchface Graphics -->
    <circle cx="250" cy="250" r="80" fill="none" stroke="#1e293b" stroke-width="2"/>
    <!-- Hour Markers -->
    <line x1="250" y1="172" x2="250" y2="182" stroke="#38bdf8" stroke-width="3"/>
    <line x1="328" y1="250" x2="318" y2="250" stroke="#ffffff" stroke-width="3"/>
    <line x1="250" y1="328" x2="250" y2="318" stroke="#ffffff" stroke-width="3"/>
    <line x1="172" y1="250" x2="182" y2="250" stroke="#ffffff" stroke-width="3"/>

    <!-- Sub-dials -->
    <circle cx="215" cy="235" r="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="215" y="238" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="7" font-weight="700">7.8k</text>
    
    <circle cx="285" cy="235" r="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="285" y="238" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="7" font-weight="700">♥ 72</text>

    <!-- Hands -->
    <line x1="250" y1="250" x2="225" y2="215" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="250" y1="250" x2="275" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="250" y1="250" x2="250" y2="310" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="250" cy="250" r="4" fill="#0ea5e9"/>

    <!-- Physical Side Buttons (Right) -->
    <rect x="360" y="200" width="8" height="24" rx="3" fill="#64748b"/>
    <rect x="360" y="275" width="8" height="24" rx="3" fill="#64748b"/>
  </g>
</svg>